name: macOS build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake sdl2
      - name: Fetch current libkss conversion tools
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/niekvlessert/libkss_conversion_tools.git \
            vendor/libkss_conversion_tools
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Parser validation
        run: |
          build/ksp1player --validate samples/SOLIDSNK_KSP1_HYBRID_RAM_VRAM.ksp
          build/ksp1player --validate samples/XAK_GAZELL_KSP1_HYBRID_RAM_VRAM.ksp
          build/ksp1player --validate samples/SOLIDSNK_KSP1_RESOURCE_MAP.ksp
